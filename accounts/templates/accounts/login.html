<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Almac & Sons</title>
</head>
<body>
    <h1>Login</h1>

    <form method="post">
    {% csrf_token %}

    {% if request.GET.next %}
        <input
            type="hidden"
            name="next"
            value="{{ request.GET.next }}"
        >
    {% endif %}

    {{ form.as_p }}

    <button type="submit">Login</button>
</form>
</body>
</html>
