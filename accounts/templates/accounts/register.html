<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Almac & Sons</title>
</head>
<body>
    <h1>Register</h1>

    <form method="post">
        {% csrf_token %}

        {% if request.GET.next %}
            <input
                type="hidden"
                name="next"
                value="{{ request.GET.next }}"
            >
        {% elif request.POST.next %}
            <input
                type="hidden"
                name="next"
                value="{{ request.POST.next }}"
            >
        {% endif %}

        {{ form.as_p }}

        <button type="submit">Register</button>
    </form>
</body>
</html>
