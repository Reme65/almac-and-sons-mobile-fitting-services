{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Confirmation | Almac & Sons</title>

    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="icon" type="image/png"
          href="{% static 'images/favicon-32x32.png' %}">
</head>

<body id="top">
    <main class="container">
        <section class="payment-confirmation">
            <h1>Payment Confirmation</h1>

            <p>
                You have returned from Stripe Checkout.
                Your payment is awaiting confirmation.
            </p>

            <p>
                Once Stripe confirms your payment,
                your account will be updated.
            </p>

            <a href="{% url 'dashboard' %}" class="btn">
                Return to My Account
            </a>
        </section>
    </main>
</body>
</html>
